name: Python CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    quality-gates:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                python-version: '3.9'
                cache: 'pip'

            - name: Install dashboard dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r dashboard/requirements.txt
                pip install pytest pytest-cov pylint

            - name: install pipeline dependencies
              run: |
                pip install -r pipeline/requirements.txt
                pip install pytest pytest-cov pylint

            - name: Test dashboard
              run: |
                pytest \
                  --cov=dashboard/ \
                  --cov-report=term-missing \
                  --cov-report=xml \
                  --cov-fail-under=50 \
                  -v \
                  dashboard/tests

            - name: Test pipeline
              run: |
                pytest \
                  --cov=pipeline/ \
                  --cov-report=term-missing \
                  --cov-report=xml \
                  --cov-fail-under=50 \
                  -v \
                  pipeline/tests

            - name: Lint dashboard
              run: |
                pylint \
                  --fail-under=6 \
                  dashboard/

            - name: Lint pipeline
              run: |
                pylint \
                  --fail-under=6 \
                  pipeline/
